# NFSv4-only so the server needs a single TCP port (2049) and no
# rpcbind/mountd, which keeps it friendly to docker port publishing.
NFS_CORE_PARAM {
    Protocols = 4;
    NFS_Port = 2049;
    Enable_NLM = false;
    Enable_RQUOTA = false;
}

NFSV4 {
    # Short grace/lease so restarts are quick in a dev environment
    Grace_Period = 15;
    Lease_Lifetime = 15;
}

EXPORT {
    Export_Id = 1;
    Path = /backup_target;
    Pseudo = /backup_target;
    Protocols = 4;
    Transports = TCP;
    Access_Type = RW;
    # Longhorn/Harvester write as root
    Squash = No_Root_Squash;
    SecType = sys;

    FSAL {
        Name = VFS;
    }
}
