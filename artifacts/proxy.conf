# Proxy locations, included in the server block of default.conf only
# when artifacts.proxy_enabled is true (see 40-artifacts-proxy.sh).

# /proxy/<host[:port]>/<path> -> http://<host[:port]>/<path>
location ~ ^/proxy/(?<up_host>[^/]+)/(?<up_path>.*)$ {
    proxy_pass http://$up_host/$up_path$is_args$args;
    proxy_set_header Host $up_host;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
}

# /proxy_ssl/<host[:port]>/<path> -> https://<host[:port]>/<path>
location ~ ^/proxy_ssl/(?<up_host>[^/]+)/(?<up_path>.*)$ {
    proxy_pass https://$up_host/$up_path$is_args$args;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host $up_host;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
}

# /proxy_ssl_insecure/<host[:port]>/<path> -> https://<host[:port]>/<path>
# without certificate verification (self-signed upstreams).
location ~ ^/proxy_ssl_insecure/(?<up_host>[^/]+)/(?<up_path>.*)$ {
    proxy_pass https://$up_host/$up_path$is_args$args;
    proxy_ssl_server_name on;
    proxy_ssl_verify off;
    proxy_set_header Host $up_host;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
}
