server {
    listen 80;
    server_name localhost;

    # Rendered from /etc/nginx/templates by the nginx image entrypoint
    # (NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1 fills in NGINX_LOCAL_RESOLVERS).
    # Needed because proxy_pass in proxy.conf uses variables.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # Proxy locations (proxy.conf), linked here at startup when
    # ARTIFACTS_PROXY_ENABLED=true.
    include /etc/nginx/server.d/*.conf;
}
